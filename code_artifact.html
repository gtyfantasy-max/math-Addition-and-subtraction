<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙位數加減速算大師</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        .math-font {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Glassmorphism effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        /* Custom smooth pulse animation for active timer */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-subtle-pulse {
            animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="w-full bg-white border-b border-slate-200 py-4 px-4 sm:px-8 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md shadow-indigo-200">
                    <i class="fa-solid font-bold fa-calculator text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 leading-tight">雙位數加減速算大師</h1>
                    <p class="text-xs text-slate-500 font-medium">5 個雙位數連續加減心算訓練</p>
                </div>
            </div>
            <!-- Live Round Badge -->
            <div id="round-badge" class="hidden sm:flex items-center space-x-2 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full text-xs font-semibold border border-indigo-100">
                <i class="fa-solid fa-layer-group"></i>
                <span>挑戰模式：5 題 / 輪</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 my-auto">
        <!-- Progress Bar & Quick Stats -->
        <div class="mb-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400" id="progress-text">進度：第 1 / 5 題</span>
                <div class="flex items-center space-x-4">
                    <span class="text-xs font-semibold text-slate-600 flex items-center gap-1">
                        <i class="fa-regular fa-clock text-indigo-500"></i>
                        <span id="timer-display" class="math-font text-sm">00:00</span>
                    </span>
                    <span class="text-xs font-semibold text-slate-600 flex items-center gap-1">
                        <i class="fa-solid fa-trophy text-amber-500"></i>
                        <span id="score-display">0 分</span>
                    </span>
                </div>
            </div>
            <!-- Progress Line -->
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full w-1/5 transition-all duration-500 ease-out rounded-full"></div>
            </div>
        </div>

        <!-- Main Math Practice Card -->
        <div id="quiz-card" class="glass-card rounded-3xl p-6 sm:p-10 shadow-xl shadow-slate-200/50 transition-all duration-300 relative overflow-hidden">
            <!-- Problem Header Tag -->
            <div class="flex items-center justify-between mb-6">
                <span id="question-tag" class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-lg">
                    題目 1
                </span>
                <span class="text-xs text-slate-400 font-medium">請在下方填寫解答，支援 Enter 直接送出</span>
            </div>

            <!-- Math Equation Display Area -->
            <div class="my-8 text-center bg-slate-50/80 p-6 sm:p-8 rounded-2xl border border-slate-100">
                <div id="equation-container" class="math-font text-2xl sm:text-4xl font-bold tracking-tight text-slate-800 leading-relaxed break-words">
                    <!-- Equation inserted dynamically via JS -->
                    42 - 85 + 13 + 67 - 29 = ?
                </div>
            </div>

            <!-- Input and Action Form -->
            <form id="answer-form" class="space-y-4 max-w-md mx-auto" onsubmit="handleFormSubmit(event)">
                <div class="relative flex items-center">
                    <input 
                        type="number" 
                        id="user-answer" 
                        placeholder="請輸入計算結果（允許負號）" 
                        class="w-full text-center text-xl sm:text-2xl font-bold math-font py-3.5 px-4 bg-white border-2 border-slate-200 rounded-xl focus:outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 transition-all shadow-inner placeholder:text-slate-300 placeholder:text-base placeholder:font-sans"
                        autocomplete="off"
                        required
                    />
                </div>

                <div class="flex gap-3">
                    <button 
                        type="submit" 
                        id="submit-btn" 
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-200 transition-all text-base flex items-center justify-center space-x-2 cursor-pointer"
                    >
                        <span>確認送出</span>
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                    <button 
                        type="button" 
                        id="next-btn" 
                        onclick="nextQuestion()" 
                        class="hidden flex-1 bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-slate-300 transition-all text-base items-center justify-center space-x-2 cursor-pointer"
                    >
                        <span id="next-btn-text">下一題</span>
                        <i class="fa-solid fa-arrow-right text-sm"></i>
                    </button>
                </div>
            </form>

            <!-- Instant Feedback and Tip Container (Hidden by default) -->
            <div id="feedback-container" class="mt-8 hidden transition-all duration-300 border-t border-slate-100 pt-6">
                <!-- Result Status Alert -->
                <div id="status-banner" class="p-4 rounded-2xl flex items-start space-x-3 mb-4">
                    <div id="status-icon" class="text-2xl mt-0.5"></div>
                    <div>
                        <h4 id="status-title" class="font-bold text-lg"></h4>
                        <p id="status-detail" class="text-sm mt-0.5"></p>
                    </div>
                </div>

                <!-- Speed Mental Math Strategy Tips -->
                <div class="bg-amber-50/80 border border-amber-200/80 rounded-2xl p-4 sm:p-5 text-amber-900">
                    <div class="flex items-center space-x-2 text-amber-800 font-bold text-sm mb-2">
                        <i class="fa-solid fa-lightbulb text-amber-500 text-base"></i>
                        <span>這題推薦的速算/心算技巧：</span>
                    </div>
                    <div id="tip-content" class="text-sm leading-relaxed space-y-2 text-slate-700">
                        <!-- Dynamic tips added via JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Round Summary Card (Hidden by default) -->
        <div id="summary-card" class="hidden glass-card rounded-3xl p-6 sm:p-10 shadow-xl shadow-slate-200/50 text-center animate-fade-in">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                <i class="fa-solid fa-award"></i>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800">本輪練習完成！</h2>
            <p class="text-slate-500 text-sm mt-1">做得好！繼續練習強化你的心算速算能力。</p>

            <!-- Stats Grid -->
            <div class="grid grid-cols-3 gap-3 sm:gap-4 my-8">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <div class="text-xs text-slate-400 font-bold uppercase">最終得分</div>
                    <div id="final-score" class="text-xl sm:text-3xl font-black text-indigo-600 math-font mt-1">100</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <div class="text-xs text-slate-400 font-bold uppercase">正確率</div>
                    <div id="final-accuracy" class="text-xl sm:text-3xl font-black text-emerald-600 math-font mt-1">5/5</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <div class="text-xs text-slate-400 font-bold uppercase">總耗時</div>
                    <div id="final-time" class="text-xl sm:text-3xl font-black text-amber-600 math-font mt-1">00:45</div>
                </div>
            </div>

            <!-- Questions Summary List -->
            <div class="text-left mb-8">
                <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-500"></i>
                    本輪答題檢討總覽
                </h3>
                <div id="summary-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Dynamic summary rows -->
                </div>
            </div>

            <!-- Retry Button -->
            <button 
                onclick="restartQuiz()" 
                class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-4 px-10 rounded-xl shadow-lg shadow-indigo-200 transition-all text-lg inline-flex items-center justify-center space-x-3 cursor-pointer"
            >
                <i class="fa-solid fa-rotate-right"></i>
                <span>再試一次（全新題目）</span>
            </button>
        </div>
    </main>

    <footer class="w-full text-center py-6 text-xs text-slate-400 border-t border-slate-200/60 bg-white/50">
        <div class="max-w-4xl mx-auto px-4">
            <p>雙位數加減速算大師 &copy; 2026 - 每天練習 5 題，輕鬆提升心算邏輯與敏感度</p>
        </div>
    </footer>

    <script>
        // State Management Variables
        const TOTAL_QUESTIONS = 5;
        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let questions = [];
        let userHistory = []; // Tracks detailed user performance for review

        // DOM Element References
        const quizCard = document.getElementById('quiz-card');
        const summaryCard = document.getElementById('summary-card');
        const equationContainer = document.getElementById('equation-container');
        const answerInput = document.getElementById('user-answer');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const nextBtnText = document.getElementById('next-btn-text');
        const feedbackContainer = document.getElementById('feedback-container');
        const statusBanner = document.getElementById('status-banner');
        const statusIcon = document.getElementById('status-icon');
        const statusTitle = document.getElementById('status-title');
        const statusDetail = document.getElementById('status-detail');
        const tipContent = document.getElementById('tip-content');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const timerDisplay = document.getElementById('timer-display');
        const scoreDisplay = document.getElementById('score-display');
        const questionTag = document.getElementById('question-tag');

        /**
         * Generates a single integer that never contains '0' anywhere in its digits.
         * Range: 11 to 99 (excluding 20, 30, ... 90, and numbers with 0)
         */
        function generateValidTwoDigitNumber() {
            let num;
            do {
                num = Math.floor(Math.random() * 89) + 10; // 10 to 99
            } while (num % 10 === 0 || num.toString().includes('0'));
            return num;
        }

        /**
         * Generates a 5-number math equation.
         * Structure: [num1, op1, num2, op2, num3, op3, num4, op4, num5]
         */
        function generateEquation() {
            const numbers = [];
            const operators = [];
            
            // Generate 5 valid two-digit numbers
            for (let i = 0; i < 5; i++) {
                numbers.push(generateValidTwoDigitNumber());
            }

            // Generate 4 operators (+ or -)
            for (let i = 0; i < 4; i++) {
                operators.push(Math.random() > 0.5 ? '+' : '-');
            }

            // Build full display array & compute real numerical result
            let displayStr = `${numbers[0]}`;
            let evalResult = numbers[0];

            for (let i = 0; i < 4; i++) {
                displayStr += ` ${operators[i]} ${numbers[i+1]}`;
                if (operators[i] === '+') {
                    evalResult += numbers[i+1];
                } else {
                    evalResult -= numbers[i+1];
                }
            }

            return {
                numbers,
                operators,
                displayStr: `${displayStr} = ?`,
                correctAnswer: evalResult
            };
        }

        /**
         * Initialize/Reset Quiz Round
         */
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            secondsElapsed = 0;
            userHistory = [];
            questions = [];

            // Generate 5 questions for this round
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                questions.push(generateEquation());
            }

            // UI updates
            quizCard.classList.remove('hidden');
            summaryCard.classList.add('hidden');
            scoreDisplay.textContent = '0 分';
            
            // Timer setup
            clearInterval(timerInterval);
            timerDisplay.textContent = '00:00';
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);

            loadQuestion(currentQuestionIndex);
        }

        /**
         * Render active question to screen
         */
        function loadQuestion(index) {
            const q = questions[index];
            
            // Reset input and view elements
            answerInput.value = '';
            answerInput.disabled = false;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            feedbackContainer.classList.add('hidden');

            // Render text
            equationContainer.textContent = q.displayStr;
            questionTag.textContent = `題目 ${index + 1}`;
            progressText.textContent = `進度：第 ${index + 1} / ${TOTAL_QUESTIONS} 題`;
            progressBar.style.width = `${((index + 1) / TOTAL_QUESTIONS) * 100}%`;

            if (index === TOTAL_QUESTIONS - 1) {
                nextBtnText.textContent = '查看最終成績';
            } else {
                nextBtnText.textContent = '下一題';
            }

            // Focus input element for quick keying
            setTimeout(() => {
                answerInput.focus();
            }, 50);
        }

        /**
         * Form Submission Logic
         */
        function handleFormSubmit(e) {
            e.preventDefault();
            
            // If already answered, ignore extra submit events
            if (answerInput.disabled) return;

            const userVal = parseInt(answerInput.value, 10);
            if (isNaN(userVal)) return;

            const q = questions[currentQuestionIndex];
            const isCorrect = (userVal === q.correctAnswer);

            if (isCorrect) {
                score += 20;
                scoreDisplay.textContent = `${score} 分`;
            }

            // Log performance details for the summary card
            userHistory.push({
                question: q.displayStr.replace(' = ?', ''),
                userVal,
                correctAnswer: q.correctAnswer,
                isCorrect
            });

            // Disable input & toggle action buttons
            answerInput.disabled = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            nextBtn.focus();

            // Display feedback & tips
            showFeedback(isCorrect, q);
        }

        /**
         * Render detailed user feedback & generate tailored speed-math calculation tips
         */
        function showFeedback(isCorrect, questionObj) {
            feedbackContainer.classList.remove('hidden');

            if (isCorrect) {
                statusBanner.className = 'p-4 rounded-2xl flex items-start space-x-3 mb-4 bg-emerald-50 border border-emerald-200 text-emerald-900';
                statusIcon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
                statusTitle.textContent = '答對了！非常優秀！';
                statusDetail.textContent = `正確答案就是 ${questionObj.correctAnswer}。`;
            } else {
                statusBanner.className = 'p-4 rounded-2xl flex items-start space-x-3 mb-4 bg-rose-50 border border-rose-200 text-rose-900';
                statusIcon.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-500"></i>';
                statusTitle.textContent = '可惜答錯了！';
                statusDetail.textContent = `你的答案：${answerInput.value}，正確答案應為：${questionObj.correctAnswer}`;
            }

            // Generate mental math strategy based on problem characteristics
            const tipsHtml = generateMentalMathTips(questionObj);
            tipContent.innerHTML = tipsHtml;
        }

        /**
         * Analyze problem layout to suggest the most efficient mental math strategies
         */
        function generateMentalMathTips(q) {
            const { numbers, operators } = q;
            
            // Reconstruct signed values: [num1, signedNum2, signedNum3, ...]
            const signedNumbers = [numbers[0]];
            for (let i = 0; i < operators.length; i++) {
                signedNumbers.push(operators[i] === '+' ? numbers[i+1] : -numbers[i+1]);
            }

            // Calculate positive and negative sums
            const posNums = signedNumbers.filter(n => n > 0);
            const negNums = signedNumbers.filter(n => n < 0);

            const posSum = posNums.reduce((a, b) => a + b, 0);
            const negSum = negNums.reduce((a, b) => a + b, 0); // Negative integer

            // Strategy 1: Positive vs Negative grouping
            let strategy1 = `<strong>💡 技巧 1：正負數分組歸類法（推薦高精準度）</strong><br/>`;
            strategy1 += `• 先加所有加數：${posNums.join(' + ')} = <span class="font-bold text-emerald-700">${posSum}</span><br/>`;
            if (negNums.length > 0) {
                const absNegs = negNums.map(n => Math.abs(n));
                strategy1 += `• 再統整合併減數：${absNegs.join(' + ')} = <span class="font-bold text-rose-700">${Math.abs(negSum)}</span><br/>`;
                strategy1 += `• 最後一次對決：${posSum} - ${Math.abs(negSum)} = <strong>${q.correctAnswer}</strong>`;
            } else {
                strategy1 += `• 最終結果：<strong>${q.correctAnswer}</strong>`;
            }

            // Strategy 2: Tens & Ones Splitting method
            let strategy2 = `<strong class="block mt-2">💡 技巧 2：十位與個位拆分法（心算不卡關）</strong><br/>`;
            
            // Calculate sum of tens and ones
            let tensSum = 0;
            let onesSum = 0;
            
            signedNumbers.forEach(num => {
                const tens = Math.floor(Math.abs(num) / 10) * (num < 0 ? -1 : 1);
                const ones = (Math.abs(num) % 10) * (num < 0 ? -1 : 1);
                tensSum += tens;
                onesSum += ones;
            });

            strategy2 += `• 先算十位總和：${tensSum * 10}<br/>`;
            strategy2 += `• 再算個位總和：${onesSum > 0 ? '+' : ''}${onesSum}<br/>`;
            strategy2 += `• 合併兩者：${tensSum * 10} ${onesSum >= 0 ? '+' : ''} ${onesSum} = <strong>${q.correctAnswer}</strong>`;

            return `
                <div class="space-y-1">
                    ${strategy1}
                    ${strategy2}
                </div>
            `;
        }

        /**
         * Advance to next question or conclude round
         */
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS) {
                loadQuestion(currentQuestionIndex);
            } else {
                showSummary();
            }
        }

        /**
         * Render round completion card and statistical metrics
         */
        function showSummary() {
            clearInterval(timerInterval);
            quizCard.classList.add('hidden');
            summaryCard.classList.remove('hidden');

            // Format timer display
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            const timeStr = `${mins}:${secs}`;

            // Correct count
            const correctCount = userHistory.filter(h => h.isCorrect).length;

            // Fill summary values
            document.getElementById('final-score').textContent = `${score} 分`;
            document.getElementById('final-accuracy').textContent = `${correctCount} / ${TOTAL_QUESTIONS}`;
            document.getElementById('final-time').textContent = timeStr;

            // Render dynamic review list
            const summaryList = document.getElementById('summary-list');
            summaryList.innerHTML = userHistory.map((item, idx) => `
                <div class="flex items-center justify-between p-3 rounded-xl border ${item.isCorrect ? 'bg-emerald-50/50 border-emerald-100' : 'bg-rose-50/50 border-rose-100'}">
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <span class="font-bold text-xs ${item.isCorrect ? 'text-emerald-600' : 'text-rose-600'}">第 ${idx + 1} 題</span>
                        <span class="math-font text-xs sm:text-sm text-slate-700 truncate">${item.question}</span>
                    </div>
                    <div class="text-right flex-shrink-0 ml-2">
                        <span class="math-font font-bold text-sm ${item.isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
                            ${item.isCorrect ? '✓ ' + item.userVal : '✗ ' + item.userVal + ' (正解:' + item.correctAnswer + ')'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        /**
         * Restart whole game
         */
        function restartQuiz() {
            startQuiz();
        }

        // Initial setup on load
        window.onload = function() {
            startQuiz();
        };
    </script>
</body>
</html>
